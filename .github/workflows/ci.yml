name: CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upstream Sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: proxifly/free-proxy-list
          upstream_sync_branch: main

      - name: Remove Socks Proxies
        run: |
          FILES='proxies/countries/US/data.txt
          proxies/countries/GB/data.txt
          proxies/countries/CA/data.txt
          proxies/countries/LU/data.txt
          proxies/countries/IE/data.txt
          proxies/countries/DK/data.txt
          proxies/countries/NL/data.txt
          proxies/countries/SE/data.txt
          '
          
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              grep -v 'socks5://' "$file" | grep -v 'socks4://' > temp.txt
              mv temp.txt "$file"
              echo "Processed: $file"
            else
              echo "File not found: $file"
            fi
          done <<< "$FILES"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b automated/filter-proxies
          git add proxies/countries/*/data.txt
          git commit -m "Remove socks4 and socks5 proxy entries"
          git push origin automated/filter-proxies -f
